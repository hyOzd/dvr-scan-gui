name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: dvr-scan-gui-linux
            binary: dvr-scan-gui
          - os: windows-latest
            name: windows
            artifact: dvr-scan-gui-windows
            binary: dvr-scan-gui.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      # Windows users can't easily `pip install` the probe tool, so bundle
      # ffprobe into the executable. Linux users install ffmpeg from their
      # package manager (the app reports what's missing at launch).
      - name: Download ffprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $ffprobe = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ffprobe.FullName -Destination ffprobe.exe

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller
          --onefile
          --windowed
          --name dvr-scan-gui
          --collect-submodules dvr_scan_gui
          run.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller
          --onefile
          --windowed
          --name dvr-scan-gui
          --collect-submodules dvr_scan_gui
          --add-binary "ffprobe.exe;."
          run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/dvr-scan-gui-linux/dvr-scan-gui release/dvr-scan-gui-linux
          cp artifacts/dvr-scan-gui-windows/dvr-scan-gui.exe release/dvr-scan-gui-windows.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
